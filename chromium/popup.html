<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenModHeader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-section="requestHeaders">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="wordmark">OpenModHeader</span>
    </div>
    <div class="topbar-actions">
      <label class="power" title="Turn all rules on or off">
        <input type="checkbox" id="power" checked>
        <span class="power-track"><span class="power-knob"></span></span>
        <span class="power-label" id="power-label">On</span>
      </label>
      <button class="icon-btn" id="btn-security" title="Credential security settings" data-icon="shield"></button>
      <button class="icon-btn" id="btn-lock" title="Lock the vault now" data-icon="lock" hidden></button>
      <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" data-icon="undo" disabled></button>
      <button class="icon-btn" id="btn-expand" title="Open in a full tab" data-icon="expand"></button>
      <button class="icon-btn" id="btn-menu" title="More" aria-haspopup="true" data-icon="more"></button>
    </div>
  </header>

  <div class="access" id="access" hidden>
    <p class="access-text">OpenModHeader has no access to your sites, so nothing is being changed.</p>
    <button class="access-btn" id="btn-grant">Grant access</button>
  </div>

  <div class="notice notice-migrate" id="migrate-banner" hidden>
    <p class="notice-text" id="migrate-text"></p>
    <button class="notice-btn" id="btn-migrate">Review</button>
  </div>

  <div class="notice notice-lock" id="lock-banner" hidden>
    <p class="notice-text" id="lock-text">Protected profiles are locked.</p>
    <button class="notice-btn" id="btn-unlock">Unlock</button>
  </div>

  <div class="profile-search" id="profile-search" hidden>
    <input type="search" id="search" placeholder="Search profiles" spellcheck="false" autocomplete="off">
  </div>

  <nav class="profiles" id="profiles" aria-label="Profiles"></nav>

  <nav class="sections" role="tablist">
    <button class="section-tab" role="tab" data-section="requestHeaders">
      <span class="arrow" data-icon="arrowUp"></span><span class="label">Request</span><span class="tally" data-tally="requestHeaders"></span>
    </button>
    <button class="section-tab" role="tab" data-section="responseHeaders">
      <span class="arrow" data-icon="arrowDown"></span><span class="label">Response</span><span class="tally" data-tally="responseHeaders"></span>
    </button>
    <button class="section-tab" role="tab" data-section="cookies">
      <span class="arrow" data-icon="cookie"></span><span class="label">Cookies</span><span class="tally" data-tally="cookies"></span>
    </button>
    <button class="section-tab" role="tab" data-section="csp">
      <span class="arrow" data-icon="policy"></span><span class="label">CSP</span><span class="tally" data-tally="csp"></span>
    </button>
    <button class="section-tab" role="tab" data-section="redirects">
      <span class="arrow" data-icon="redirect"></span><span class="label">Redirects</span><span class="tally" data-tally="redirects"></span>
    </button>
    <button class="section-tab" role="tab" data-section="filters">
      <span class="arrow" data-icon="filter"></span><span class="label">Filters</span><span class="tally" data-tally="filters"></span>
    </button>
  </nav>

  <div class="settings-bar" id="settings-bar" hidden>
    <button class="back-btn" id="btn-back" data-icon="back" title="Back to headers"></button>
    <span class="settings-bar-title">Credential security</span>
    <span class="settings-bar-tally" id="settings-tally"></span>
  </div>

  <main id="content" role="tabpanel"></main>

  <footer class="statusbar">
    <button class="add-btn" id="btn-add">Add header</button>
    <p class="status" id="status"></p>
  </footer>

  <div class="popover" id="profile-menu" hidden>
    <label class="field">
      <span class="field-label">Name</span>
      <input type="text" id="profile-name" maxlength="60" spellcheck="false">
    </label>
    <div class="field">
      <span class="field-label">Colour</span>
      <div class="swatches" id="profile-colors"></div>
    </div>
    <label class="toggle-row">
      <input type="checkbox" id="profile-enabled">
      <span>Profile is on</span>
    </label>
    <div class="popover-actions">
      <button class="ghost-btn" id="btn-duplicate">Duplicate</button>
      <button class="ghost-btn danger" id="btn-delete-profile">Delete</button>
    </div>
  </div>

  <div class="popover" id="main-menu" hidden>
    <button class="menu-item" id="btn-export">Export profiles to a file</button>
    <button class="menu-item" id="btn-import">Import profiles from a file</button>
    <button class="menu-item" id="btn-copy">Copy profiles as JSON</button>
    <hr>
    <button class="menu-item danger" id="btn-reset">Delete everything and start over</button>
  </div>

  <div class="modal-scrim" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <datalist id="request-header-names"></datalist>
  <datalist id="response-header-names"></datalist>
  <datalist id="csp-directive-names"></datalist>
  <input type="file" id="file-input" accept="application/json,.json" hidden>
  <script type="module" src="popup.js"></script>
</body>
</html>
